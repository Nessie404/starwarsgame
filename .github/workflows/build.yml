name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Host tests (game logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          gcc -std=c99 -O2 -Wall -Werror -Isource \
              tests/test_game.c source/game.c source/track.c -lm -o wiikart-test
          ./wiikart-test

  build:
    name: Wii homebrew (devkitPPC)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build boot.dol
        run: make
      - name: Package Homebrew Channel app
        run: make dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiikart
          path: |
            wiikart.dol
            wiikart.elf
            dist/
