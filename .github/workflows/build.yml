name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Host tests (game logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          gcc -std=c99 -O2 -Wall -Werror -Isource \
              tests/test_game.c source/game.c source/track.c source/config.c \
              source/camera.c -lm -o wiikart-test
          ./wiikart-test

  build:
    name: Wii homebrew (devkitPPC)
    runs-on: ubuntu-latest
    # Pinned by digest, not by :latest. A moving build image means two
    # builds of the same source are not the same binary, which is exactly
    # the variable you do not want while chasing a boot failure.
    container: devkitpro/devkitppc@sha256:44cb1a920e1ec3ec7c06767493c3b85f8d643d6137cc4661f0201895ac6e4967
    steps:
      - uses: actions/checkout@v4
      - name: Build boot.dol
        run: make
      - name: Check the DOL the way Dolphin's loader does
        run: python3 tools/validate_dol.py wiikart.dol

      - name: Package Homebrew Channel app
        run: make dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiikart
          path: |
            wiikart.dol
            wiikart.elf
            dist/

  release:
    name: Publish downloadable release
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wiikart
      - name: Package zip
        run: |
          mkdir pkg
          cp wiikart.dol pkg/
          cp -r dist/apps pkg/apps
          cp -r config pkg/config
          cp CHANGELOG.md TODO.md pkg/
          cat > pkg/README.txt <<'EOF'
          WiiKart — original kart racer for the Nintendo Wii (homebrew)

          Play in the Dolphin emulator (https://dolphin-emu.org):
            File > Open... > wiikart.dol

          Play on a real Wii:
            copy the "apps" folder to your SD card, launch from the
            Homebrew Channel.

          Controls
            Wii Remote (sideways): tilt = steer, 2 = gas, 1 = brake,
              B = handbrake, - = item, + = menu, HOME = quit. In manual
              gearbox mode, D-pad up/down = shift and left/right = steer.
            GameCube input: stick = steer, A or X = gas, B = brake,
              Z = handbrake, Y = item, R/L = shift, START = menu.
            Recommended Xbox-to-GameCube map in Dolphin: left stick =
              stick, RT = A, LT = B, A = Z, X = Y, RB = R, LB = L,
              START = START. The live input panel shows this translation.
            Keyboard player 1: WASD = drive, E = shift up, Q = shift down,
              X = power-up, Space = handbrake.
            Keyboard player 2: IJKL = drive, O = shift up, U = shift down,
              M = power-up, P = handbrake.
            Menus: up/down picks a row, left/right changes its value.
              Keyboard Enter confirms and Esc backs out. With the map
              above, Xbox A or RT confirms and LT backs out.
            In a race, menu pauses at a leave-race confirmation. Confirm
              leaves; Back or Menu again resumes the race.

          Tuning
            Editable JSON files are in apps/wiikart/config (and mirrored
            in config for reference). See config/README.md.
          EOF
          (cd pkg && zip -r ../wiikart.zip .)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -f VERSION ]]; then
            TAG="v$(cat VERSION)"
          else
            TAG="build-${{ github.run_number }}"
          fi
          TITLE="WiiKart ${TAG}"
          # Release notes live in the repo so they can be reviewed with the
          # code that produced them; without a file the generic blurb is
          # good enough.
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES_ARG=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARG=(--notes "Download wiikart.zip, unzip, and open wiikart.dol in the Dolphin emulator (or copy the apps folder to an SD card for a real Wii). See the README for controls.")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wiikart.zip --clobber
            if [[ -f "$NOTES_FILE" ]]; then
              gh release edit "$TAG" --title "$TITLE" "${NOTES_ARG[@]}"
            fi
          else
            gh release create "$TAG" wiikart.zip \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              "${NOTES_ARG[@]}" \
              --latest
          fi
