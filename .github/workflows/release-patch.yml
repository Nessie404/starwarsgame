name: release-patch

# Publishes a patch release of an OLDER version line — for example v1.0.1,
# which is v1.0 plus the steering fix and nothing else.
#
# Those releases cannot be built from this branch's HEAD: a v1.0.1 build
# must not contain the v1.1 work. Rather than carrying a divergent branch,
# the change is kept as a patch file under patches/ and applied on top of
# the base tag here, so the published binary really is "that release plus
# this patch". Run it by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Tag to build from (e.g. v1.0)'
        required: true
      version:
        description: 'Version to publish (e.g. 1.0.1)'
        required: true
      patch:
        description: 'Patch file, relative to the repo root'
        required: true

jobs:
  build:
    name: Build ${{ inputs.version }} from ${{ inputs.base_tag }}
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Check out this branch (for the patch file)
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base tag (the code being patched)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_tag }}
          path: base

      - name: Apply the patch
        working-directory: base
        run: |
          set -eu
          echo "Applying ../head/${{ inputs.patch }} onto ${{ inputs.base_tag }}"
          git apply --verbose "../head/${{ inputs.patch }}"

      - name: Host tests
        working-directory: base
        run: |
          gcc -std=c99 -O2 -Wall -Werror -Isource \
              tests/test_game.c source/game.c source/track.c -lm \
              -o wiikart-test
          ./wiikart-test

      - name: Build boot.dol
        working-directory: base
        run: make

      - name: Package Homebrew Channel app
        working-directory: base
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: wiikart-${{ inputs.version }}
          path: |
            base/wiikart.dol
            base/dist/

  publish:
    name: Publish ${{ inputs.version }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wiikart-${{ inputs.version }}
      - name: Package zip
        run: |
          set -eu
          mkdir pkg
          cp wiikart.dol pkg/
          cp -r dist/apps pkg/apps
          cat > pkg/README.txt <<EOF
          WiiKart ${{ inputs.version }} — original kart racer for the Wii

          Built from ${{ inputs.base_tag }} plus ${{ inputs.patch }}.

          Play in the Dolphin emulator (https://dolphin-emu.org):
            File > Open... > wiikart.dol

          Play on a real Wii:
            copy the "apps" folder to your SD card, launch it from the
            Homebrew Channel.

          Keyboard: A/D steer (A really is left), W gas, S brake.
          EOF
          (cd pkg && zip -r ../wiikart.zip .)
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="v${{ inputs.version }}"
          BASE_REF=$(gh api "repos/$GH_REPO/git/refs/tags/${{ inputs.base_tag }}")
          BASE_SHA=$(echo "$BASE_REF" | jq -r .object.sha)
          BASE_TYPE=$(echo "$BASE_REF" | jq -r .object.type)
          echo "base ${{ inputs.base_tag }} -> $BASE_TYPE $BASE_SHA"
          # An annotated tag points at a tag object, not a commit; a release
          # target has to be a commit, so peel it.
          if [ "$BASE_TYPE" = "tag" ]; then
            BASE_SHA=$(gh api "repos/$GH_REPO/git/tags/$BASE_SHA" -q .object.sha)
            echo "peeled to commit $BASE_SHA"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wiikart.zip --clobber
          else
            # Create the tag first and then the release against it. Asking
            # `gh release create --target` to mint the tag as a side effect
            # was rejected with "403 Resource not accessible by
            # integration" for some tags, while creating the ref directly
            # works; doing it in two steps is also easier to debug.
            if ! gh api "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
              if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" \
                                                    -f sha="$BASE_SHA"; then
                # Some tag names are refused with "403 Resource not
                # accessible by integration" (a repository ruleset this
                # workflow's token cannot bypass) while others go through.
                # Rather than fail and publish nothing, hang the build off
                # the base release as an extra asset so the download link
                # still exists. Print the rulesets to say why.
                echo "::warning::cannot create refs/tags/$TAG; attaching to ${{ inputs.base_tag }} instead"
                gh api "repos/$GH_REPO/rulesets" \
                  -q '.[] | "ruleset: \(.name) target=\(.target) enforcement=\(.enforcement)"' || true
                ASSET="wiikart-${{ inputs.version }}.zip"
                mv wiikart.zip "$ASSET"
                gh release upload "${{ inputs.base_tag }}" "$ASSET" --clobber
                echo "attached $ASSET to the ${{ inputs.base_tag }} release"
                gh release list
                exit 0
              fi
              echo "created refs/tags/$TAG at $BASE_SHA"
            fi
            # not marked latest: these are fixes to older lines, and the
            # newest release should stay the newest
            gh release create "$TAG" wiikart.zip \
              --verify-tag \
              --title "WiiKart $TAG" \
              --notes "${{ inputs.base_tag }} plus \`${{ inputs.patch }}\`. Download wiikart.zip, unzip, and open wiikart.dol in the Dolphin emulator (or copy the apps folder to an SD card for a real Wii)." \
              --latest=false
          fi
          gh release list
